name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

# julia-actions/cache prunes stale caches through the GitHub API. 
# Without `actions: write` that prune fails with HTTP 403 on every run.
permissions:
  actions: write
  contents: read

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  test:
    # The examples (23 scripts, each in its own Julia process) take about as long as the rest of the
    # suite, so they run as a job of their own, in parallel with it.
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}${{ matrix.group == 'examples' && ' - examples' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - windows-latest        # PETSc_jll >= 3.25.4 ships MPI-enabled (MicrosoftMPI) Windows binaries
          - macOS-latest          # Apple Silicon; the default architecture of each runner is used
        group:
          - '-examples'           # every test group but the examples
          - 'examples'
        include:
          # PETSc_jll >= 3.25 requires Julia 1.12, so 'min' resolves to the oldest supported 1.12.x
          - os: ubuntu-latest
            version: 'min'
            group: '-examples'
          - os: ubuntu-latest
            version: 'min'
            group: 'examples'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          # The v0.5 shims warn through `@warn` rather than `Base.depwarn`, but
          # anything still on `Base.@deprecate` is silent without this.
          depwarn: yes
          test_args: ${{ matrix.group }}

  # The suite against PETSc built from source and loaded through set_library!,
  # the path a cluster or GPU installation takes.
  custom-library:
    name: Julia 1 - ubuntu-latest - PETSc built from source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: actions/cache@v6
        with:
          path: ~/petsc
          key: petsc-${{ runner.os }}-${{ hashFiles('scripts/build_petsc.sh') }}
      - name: Build PETSc
        run: test -f ~/petsc/lib/libpetsc.so || scripts/build_petsc.sh ~/petsc -j 4
      - name: Select the library
        run: julia --project -e 'using PETSc; PETSc.set_library!(expanduser("~/petsc/lib/libpetsc.so"))'
      - uses: julia-actions/julia-runtest@latest
        with:
          depwarn: yes
