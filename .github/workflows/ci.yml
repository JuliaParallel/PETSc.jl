name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

# julia-actions/cache prunes stale caches through the GitHub API. 
# Without `actions: write` that prune fails with HTTP 403 on every run.
permissions:
  actions: write
  contents: read

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - windows-latest        # PETSc_jll >= 3.25.4 ships MPI-enabled (MicrosoftMPI) Windows binaries
          - macOS-latest          # Apple Silicon; the default architecture of each runner is used
        include:
          # PETSc_jll >= 3.25 requires Julia 1.12, so 'min' resolves to the oldest supported 1.12.x
          - os: ubuntu-latest
            version: 'min'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - run: julia -e 'using InteractiveUtils; versioninfo(verbose=true)'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          # The v0.5 shims warn through `@warn` rather than `Base.depwarn`, but
          # anything still on `Base.@deprecate` is silent without this.
          depwarn: yes
        
