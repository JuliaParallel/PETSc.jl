# Hand-maintained per-function argument overrides. Merged over rules/args_mined.toml (this file
# wins). Keys per argument: direction = "in"|"out"|"inout", nullable, byref, size, prelude, nullinit, len.
# "inout": a `T *x` scalar PETSc reads and overwrites; it is an argument and is returned.
# See wrapping/WRAPPING.md.

# PETSc allows NULL for the optional arrays of MatRestoreRow
[MatRestoreRow.cols]
nullable = true
[MatRestoreRow.vals]
nullable = true

# DMPlexGetClosureIndices: PETSc needs room for up to 32 field offsets; `values` is optional
[DMPlexGetClosureIndices.outOffsets]
len = "32"
[DMPlexGetClosureIndices.values]
direction = "in"
nullable = true
[DMPlexRestoreClosureIndices.outOffsets]
nullable = true
[DMPlexRestoreClosureIndices.values]
nullable = true

# DMPlexGetCellCoordinates: both arrays hold Nc scalars
[DMPlexGetCellCoordinates.array]
size = "Nc"
[DMPlexGetCellCoordinates.coords]
size = "Nc"

# ownership ranges: one entry per rank plus one
[MatGetOwnershipRanges.ranges]
prelude = "nproc = MPI.Comm_size(PetscObjectGetComm(petsclib, mat))"
size = "nproc + 1"
[MatGetOwnershipRangesColumn.ranges]
prelude = "nproc = MPI.Comm_size(PetscObjectGetComm(petsclib, mat))"
size = "nproc + 1"

# PETSc fills nRow*nCol values
[DMStagMatGetValuesStencil.val]
len = "nRow * nCol"

