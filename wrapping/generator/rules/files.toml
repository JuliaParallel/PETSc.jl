# Which PETSc classes go into which generated file, and the include order.
# `standalone = true` collects every function that getAPI.py did not attach to a class.

# Functions never wrapped (name => reason). Functions containing "_" are always skipped.
[exclude]
LandauKokkosCreateMatMaps = "Kokkos only"
LandauKokkosDestroyMatMaps = "Kokkos only"
LandauKokkosJacobian = "Kokkos only"
LandauKokkosStaticDataClear = "Kokkos only"
LandauKokkosStaticDataSet = "Kokkos only"
PetscObjectListAdd = "not wrapped in the hand-edited baseline"
PetscBagGetNames = "fills a caller-allocated array of C strings; no Julia-side length"
# Functions that exist in the snapshot but not in libpetsc (found with check_symbols.jl):
DMPlexSetGlobalToNaturalSF = "static inline in a header; no symbol in libpetsc"
